<!DOCTYPE html>
<html>

<head>
  <title>Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/shared-styles.css">

  <style>
    .next-button, .back-button {
      padding: 15px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      color: #333;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    .back-button {
      display: 'none';
    }

    .button-group {
      display: flex;
      flex-direction: column;   /* stack vertically */
      align-items: center;      /* center horizontally */
      gap: 15px;                /* spacing between buttons */
    }

    .next-button:hover, .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, #fed6e3 0%, #a8edea 100%);
    }

    @keyframes slideInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .explanation-text {
      color: #c9cddf;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-top: 5px;
      margin-bottom: 15px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Corps connectés</h1>
    <h2> <p class="subtitle"> Oups </p> </h2>
    <h3> <p class="timing"> </p> </h3>
    

    <div id="explanation" class="explanation">
      <div class="explanation-text">
        Oups vous êtes perdu·es ?
      </div>

    <div class="button-group">
      <button id="next-btn" class="next-button">Retour à l'acceuil</button>
      <button id="back-btn" class="back-button">Retour à l'acceuil</button>
    </div>

    </div>

  </div>

</body>

<script>

  // Get user id and stage to now what to display and to which page next button redirects
  const userId = {{userId}};
  const stage = "{{stage}}";

  const subtitle = document.getElementsByClassName("subtitle")[0];
  const timing = document.getElementsByClassName("timing")[0];
  const explanation = document.getElementsByClassName("explanation-text")[0];
  const nextBtn = document.getElementById("next-btn");
  const backBtn = document.getElementById("back-btn");

  backBtn.style.display = 'none';
  timing.style.display = 'none';

  // Change text depending at what stage we are at
  if (stage == 'onboarding1') {

    subtitle.innerText = `Bienvenue !`;
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Bienvenue dans votre voyage émotionnel. </p>
      <p>Suivez les <span style="color:#6E92DB;"><strong>pastilles bleues</strong></span> et laissez l’application vous guider 
        le long d’un parcours centré sur vos ressentis, vos émotions. </p>`

  } else if (stage == 'onboarding2') {

    subtitle.innerText = `Bienvenue !`;
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Si vous rencontrez le moindre problème ou avez une question, n'hésitez pas à vous adressez aux 
        personnes portant un t-shirt blanc avec une pastille noires.</p>`;

  } else if (stage == 'baseline') {

    subtitle.innerText = `1. Installation: Cinéma`;
    timing.style.display = 'block';
    timing.innerText = '5 min';
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Installez-vous face au documentaire. Observez le film et laissez vos émotions se déposer 
        tranquillement dans l’instant présent…</p>`;

  } else if (stage == 'post-baseline') {

    subtitle.style.display = `none`;
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Merci pour votre temps. Il nous a permis de vous contempler plus en profondeur, au-delà 
        des apparences… </p>
      <p>Vous pouvez désormais vous dirigez vers deux nouvelles expériences : le karaoké ou la fresque des émotions.</p>`;
    
  } else if (stage == 'karaoke') {

    subtitle.innerText = `2. Installation : Karaoké`;
    timing.style.display = 'block';
    timing.innerText = '10 min';
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Maintenant, le voyage prend une nouvelle forme. Parfois en solo, parfois en duo, ou en groupe…</p>
      <p>Alors, vous chantez seul ou vous rejoignez la bande ?</p>`;
    
  } else if (stage == 'karaoke-solo') {

    subtitle.style.display = 'none';
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Vous avez choisi le mode solo. </p>
      <p>Chantez, laissez-vous emporter. Votre énergie se reflète dans votre rythme cardiaque, en résonance avec la musique. </p>`;

  }  else if (stage == 'karaoke-multi') {

    subtitle.style.display = 'none';
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Vous avez choisi le mode multi-joueur. </p>
      <p>Chantez, laissez-vous emporter. Votre énergie se reflète dans votre rythme cardiaque, en résonance avec la musique
        et avec les autres. </p>`;

  } else if (stage == 'post-karaoke') { 

    subtitle.style.display = `none`;
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Les émotions ne restent pas seulement intérieures : elles circulent, se propagent et créent des liens invisibles 
        entre les individus…</p>
      <p>Ici vous pouvez observer comment votre rythme cardiaque s’est emballé et comment il a aussi vibré à l’unisson avec les 
        autres participants.`;

  } else if (stage == 'fresque1') {

    subtitle.innerText = `3. Installation : Fresque des émotions`;
    timing.style.display = 'block';
    timing.innerText = '? min';
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Dans la vie, notre corps et nos sens nous guident.<p/>
      <p>Maintenant, c’est à vous de choisir ce qui stimulera vos émotions. <br>
        Choisissez une de ces questions inspirées de la fresque collective :</p>
      <p style="color:#EB7C38;">Dans une foule en plein concert, <br>
        je me sens…<br>
        Dans une manifestation, <br>
        je pense que la foule est…<br></p>`;

  } else if (stage == 'fresque2') {
    
    subtitle.style.display = `none`;
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Laissez vos sens, corps et votre imagination créer une situation qui provoque vos émotions. </p>
      <p>Pour vous aider : quelques postures sont suggérées. Les pistes audio vous aident à vous immerger davantage. 
        Mais vous pouvez aussi suivre vos propres idées.</p>`;

  } else if (stage == 'post-fresque') {

    subtitle.style.display = `none`;
    nextBtn.innerText = 'Suivant';

    explanation.innerHTML = `
      <p>Cette expérience s’inspire des recherches sur la perception et la régulation des émotions : </p>
      <p>apprendre à reconnaître son état intérieur, puis à l’exprimer ou à le transformer à travers l’art, les techniques 
        de respiration, ou un geste symbolique.</p>`;
    
  } else if (stage == 'exit1') {

    subtitle.innerText = `Finir l'expérience`;
    nextBtn.innerText = 'Terminer';
    backBtn.style.display = 'block';

    explanation.innerHTML = `
      <p>Avez-vous pris une capture d'écran de vos émotions ? Vous ne pourrez plus visualiser vos résultats après avoir terminé.</p>`;

  } else if (stage == 'exit2') {

    subtitle.style.display = 'none';
    nextBtn.style.display = 'none';

    explanation.innerHTML = `
      <p>N'oubliez pas de rendre votre bracelet à la personne avec un t-shirt blanc avec un pastille noire à la sortie !</p>
      <p>Merci pour votre participation.</p>`;
  }

  // Next button - redirect to wherever it should depending on step
  nextBtn.addEventListener("click", (e) => {
    // Add visual feedback
    nextBtn.style.transform = "scale(0.95)";
    setTimeout(() => {
      nextBtn.style.transform = "";
    }, 150);
    // Redirect toward right page
    setTimeout(() => {

      if (stage == 'onboarding1') {
        window.location.href = `/info-panel/onboarding2/${userId}`;
      } else if (stage == 'onboarding2') {
        window.location.href = `/info-panel/baseline/${userId}`;
      } else if (stage == 'baseline') {
        window.location.href = `/room/0/${userId}`;
      } else if (stage == 'post-baseline') {
        window.location.href = `/room-selection/${userId}`;
      } else if (stage == 'karaoke') {
        window.location.href = `/multiplayer/1/${userId}`;
      } else if (stage == 'karaoke-solo') {
        window.location.href = `/room/1/${userId}`;
      } else if (stage == 'karaoke-multi') {
        window.location.href = `/room/1/${userId}`;
      } else if (stage == 'post-karaoke') { 
        window.location.href = `/room-selection/${userId}`;
      } else if (stage == 'fresque1') {
        window.location.href = `/info-panel/fresque2/${userId}`;
      } else if (stage == 'fresque2') {
        window.location.href = `/room/2/${userId}`;
      } else if (stage == 'post-fresque') {
        window.location.href = `/room-selection/${userId}`;
      } else if (stage == 'result') {
        window.location.href = `/room-selection/${userId}`;
      } else if (stage == 'exit1') {
        window.location.href = `/info-panel/exit2/${userId}`;
      } else if (stage == 'exit2') {
        window.location.href = '/';
      } else {
        window.location.href = '/';
      }

    }, 200);
  });

  backBtn.addEventListener("click", (e) => {
    // Add visual feedback
    nextBtn.style.transform = "scale(0.95)";
    setTimeout(() => {
      nextBtn.style.transform = "";
    }, 150);
    // Redirect toward right page
    setTimeout(() => {
      window.location.href = `/room-selection/${userId}`;
    }, 200);
  });

  // Add touch feedback for better mobile experience
  document.querySelectorAll(".next-button").forEach(btn => {
    btn.addEventListener("touchstart", () => {
      btn.style.transform = "translateY(-1px) scale(0.98)";
    });

    btn.addEventListener("touchend", () => {
      setTimeout(() => {
        btn.style.transform = "";
      }, 100);
    });
  });

</script>

</html>
