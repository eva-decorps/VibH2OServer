<!DOCTYPE html>
<html>

<head>
  <title>Recording - Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/shared-styles.css">

  <style>
    html,
    body {
      height: 100vh;
    }

    h1 {
      font-size: 2rem;
    }

    .status-text {
      font-size: 1.2rem;
      color: #a0a6c0;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .timer-display {
      font-size: 3rem;
      font-weight: bold;
      color: #e0e6f0;
      margin: 30px 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    .record-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      margin: 20px auto;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .record-button.record {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
    }

    .record-button.record:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #ff8e53 0%, #ff6b6b 100%);
    }

    .record-button.stop {
      background: linear-gradient(135deg, #666 0%, #333 100%);
      animation: pulse 2s infinite;
    }

    .record-button.stop:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #333 0%, #666 100%);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 107, 107, 0.7);
      }
      50% {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 0 20px rgba(255, 107, 107, 0);
      }
      100% {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 107, 107, 0);
      }
    }

    .control-buttons {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }

    .control-buttons.show {
      display: flex;
    }

    .action-button {
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      min-height: 50px;
    }

    .action-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .action-button:active {
      transform: translateY(0);
    }

    .cancel-button {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    }

    .cancel-button:hover {
      background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
    }

    .next-button {
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
    }

    .next-button:hover {
      background: linear-gradient(135deg, #44a08d 0%, #4ecdc4 100%);
    }

    .recording-indicator {
      display: none;
      color: #ff6b6b;
      font-size: 1rem;
      margin-bottom: 10px;
      animation: blink 1.5s infinite;
    }

    .recording-indicator.show {
      display: block;
    }

    @keyframes blink {
      0%,
      50% {
        opacity: 1;
      }
      51%,
      100% {
        opacity: 0.3;
      }
    }

    @media (max-width: 480px) {
      .timer-display {
        font-size: 2.5rem;
        margin: 20px 0;
      }

      .record-button {
        width: 100px;
        height: 100px;
        font-size: 1rem;
      }

      .action-button {
        padding: 12px 25px;
        font-size: 1rem;
        min-height: 45px;
      }

      .status-text {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <h1>Corps connectés</h1>
      <div class="recording-indicator" id="recordingIndicator">● REC</div>
      <div class="status-text" id="statusText">Ready to record</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
    </div>

    <div>
      <button class="record-button record" id="recordButton" onclick="toggleRecording()">
        <span id="buttonText">RECORD</span>
      </button>

      <div class="control-buttons" id="controlButtons">
        <button class="action-button cancel-button" id="cancel-button" onclick="cancelRecording()">
          Annuler
        </button>
        <button class="action-button next-button" id="next-button" onclick="nextStep()">
          Enregistrer
        </button>
      </div>
    </div>
  </div>

  <script>

    // Get user id, room id
    const roomId = {{roomId}};
    const userId = {{userId}};
    // Different button if recording not started yet or already finished
    let recordingFinished = false;
    let isRecording = {{isRecording}};
    // Tmer
    let startTime = {{startTime}};
    let timerInterval = null;
    // Prevent simultaneous recording
    const alreadyRecording = {{alreadyRecording}};
    const roomRecording = {{roomRecording}};
    // Prevent screen sleep during recording (if supported)
    let wakeLock = null;
    // Beeper
    const beepSound = new Audio('/ressources/beep-recording-end.mp3');
    let audioEnabled = false;
    let audioContext;

    // Mettre une fonction init ici : 
    function init() {

      const recordButton = document.getElementById('recordButton');
      const buttonText = document.getElementById('buttonText');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const timerDisplay = document.getElementById('timerDisplay');

      const statusText = document.getElementById('statusText');
      const nextButton = document.getElementById('next-button');
      const cancelButton = document.getElementById('cancel-button');
      const controlButtons = document.getElementById('controlButtons');

      controlButtons.classList.add('show');

      // Init recording state
      if (isRecording)
      {
        // Retrieve recording timer
        recordButton.className = 'record-button stop';
        buttonText.textContent = 'STOP';
        recordingIndicator.classList.add('show');

        if (roomId == 0) {
          statusText.textContent = `Enregistrement de la baseline en cours...
          Appuyez sur stop une fois les 5 minutes passées.`;
        } else if (roomId == 1) {
          statusText.textContent = `Enregistrement du karaoké en cours...
          Appuyez sur stop une fois le karaoké terminé.`;
        } else if (roomId == 2) {
          statusText.textContent = `Enregistrement de la fresque en cours... 
          Appuyez sur stop une fois l'activité terminée.`;
        } 

        startTimer();
      } else if (alreadyRecording) 
      {
        // Only button back to room recording
        nextButton.style.display = 'block';
        nextButton.textContent = `Retour à l'enregistrement`;
        cancelButton.style.display = 'none';
        recordButton.style.display = 'none';

        if (roomRecording == 0) {
          statusText.textContent =  `Oups, la baseline est déjà en cours d'enregistrement ! 
          Retournez sur la baseline pour stopper ou annuler l'enregistrement.`;
        } else if (roomRecording == 1) {
          statusText.textContent =  `Oups, le karaoké est déjà en cours d'enregistrement ! 
          Retournez sur le karaoké pour stopper ou annuler l'enregistrement.`;
        } else if (roomRecording == 2) {
          statusText.textContent =  `Oups, la fresque est déjà en cours d'enregistrement ! 
          Retournez sur la fresque pour stopper ou annuler l'enregistrement.`;
        }

      } else
      {
        // Init timer and button
        recordButton.style.display = 'flex';
        recordButton.className = 'record-button record';
        buttonText.textContent = 'RECORD';
        recordingIndicator.classList.remove('show');
        timerDisplay.textContent = '00:00';

        cancelButton.style.display = 'none';
        
        if (roomId == 0) {
          statusText.textContent = `
          Quand vous êtes assis·e, détendez-vous et appuyez sur "Record", l’enregistrement s'achèvera par un signal sonore.`;
          nextButton.style.display = 'none';
        } else if (roomId == 1) {
          statusText.textContent = `N’oubliez pas d’activer le bouton “Enregistrement“ 
          au début et “Stop” à la fin de votre performance”`;
          nextButton.textContent = `Retour à la sélection`;
          nextButton.style.display = 'block';
        } else if (roomId == 2) {
          statusText.textContent = `Prêt·e pour l'enregistrement de la fresque ? 
          Appuyer sur le bouton record et arrêtez quand vous avez fini l'activité.`;
          nextButton.textContent = `Retour à la sélection`;
          nextButton.style.display = 'block';
        }
      }
    }

    function toggleRecording() {

      // Makes sure audio is enabled
      if (!audioEnabled) {
        enableAudioAndVibration();
      } else {
        alertUser();
      }

      const recordButton = document.getElementById('recordButton');
      const buttonText = document.getElementById('buttonText');
      const statusText = document.getElementById('statusText');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const controlButtons = document.getElementById('controlButtons');

      const nextButton = document.getElementById('next-button');
      const cancelButton = document.getElementById('cancel-button');

      if (!isRecording) {
        // Start recording
        isRecording = true;
        startTime = Date.now();

        recordButton.className = 'record-button stop';
        recordingIndicator.classList.add('show');
        if (roomId > 0) buttonText.textContent = 'STOP';
        else buttonText.textContent = '';

        if (roomId == 0) {
          statusText.textContent = `Enregistrement de la baseline en cours...
          Appuyez sur stop une fois les 3 minutes passées.`;
        } else if (roomId == 1) {
          statusText.textContent = `Enregistrement du karaoké en cours...
          Appuyez sur stop une fois le karaoké terminé.`;
        } else if (roomId == 2) {
          statusText.textContent = `Enregistrement de la fresque en cours... 
          Appuyez sur stop une fois l'activité terminée.`;
        } 

        // Allow to cancel but not to go back to selection or go to next step
        nextButton.style.display = 'none';
        cancelButton.style.display = 'block';
        cancelButton.classList.add('show');

        startTimer();
        releaseWakeLock();

        fetch(`/api/record/start/${userId}/${roomId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          }
        })
        .then(response => response.json())
        .then(data => {
          if (!data.success) {
            console.error('Failed to start recording:', data.message);
          }
        })
        .catch(error => {
          console.error('Error calling start recording API:', error);
        });
          
      } else {

        // Check the minimun time interval has been reached
        const elapsedMin = (Date.now() - startTime) / 60000;
        if (roomId == 0 && elapsedMin < 3) 
        {
          statusText.textContent = `Enregistrement de la baseline en cours (5 min)...
          Encore un peu de patience !`;
          
        } else 
        {
          // Stop recording
          isRecording = false;
          recordingFinished = true;

          recordButton.style.display = 'none';
          recordingIndicator.classList.remove('show');

          if (roomId == 0) {
            statusText.textContent = `Enregistrez la baseline pour aller à l'étape suivante !`;
          } else if (roomId == 1) {
            statusText.textContent = `Enregistrez le karaoké pour aller à l'étape suivante !`;
          } else if (roomId == 2) {
            statusText.textContent = `Enregistrez la fresque pour aller à l'étape suivante !`;
          } 

          // Allow both to go to next setp or cancel
          cancelButton.classList.add('show');
          cancelButton.style.display = 'block';

          nextButton.classList.add('show');
          nextButton.style.display = 'block';
          nextButton.innerText = 'Enregistrer';

          stopTimer();
          requestWakeLock();

          // Call the POST API to stop recording
          fetch(`/api/record/stop/${userId}/${roomId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            }
          })
          .then(response => response.json())
          .then(data => {
            if (!data.success) {
              console.error('Failed to stop recording:', data.message);
            }
          })
          .catch(error => {
            console.error('Error calling stop recording API:', error);
          });

        }
      }
    }

    function cancelRecording() {
      
      // Reset to initial state
      isRecording = false;
      startTime = null;
      recordingFinished = false;
      stopTimer();  
      init();

      fetch(`/api/record/cancel/${userId}/${roomId}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        }
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            stopTimer();
          } else {
            console.error('Failed to cancel recording:', data.message);
          }
        })
        .catch(error => {
          console.error('Error calling cancel recording API:', error);
        });
    }

    function nextStep() {

      if (alreadyRecording) 
      {
        // Go back to the room currently recording
        window.location.href = `/room/${roomRecording}/${userId}`;

      } else if (recordingFinished) 
      {
        // Go to next step
        if (roomId == 0) {
          window.location.href = `/info-panel/post-baseline/${userId}`;
        } else if (roomId == 1) {
          window.location.href = `/info-panel/post-karaoke/${userId}`;
        } else if (roomId == 2) {
          window.location.href = `/info-panel/post-fresque/${userId}`;
        }  

      } else 
      {
        // If before recording go back to room selection
        window.location.href = `/room-selection/${userId}`;
      }

    }

    // Timer
    function startTimer() {
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const minutes = Math.floor(elapsed / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);

        // When minimum time is reached for baseline : beeps and vibrates
        if (minutes == 3 && seconds == 0 && roomId == 0) {
          buttonText.textContent = 'STOP'; 
          alertUser();
        }

        // When maximum time is reached : stops recording
        if (minutes == 10) {
          toggleRecording();
        }

        document.getElementById('timerDisplay').textContent =
          `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake lock not supported:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    // Enable audio and vibration (requires user interaction)
    function enableAudioAndVibration() {
      try {
        
        // Test beep to "wake up" audio
        beepSound.volume = 0.1;
        beepSound.play().then(() => {
          beepSound.volume = 1.0;
          audioEnabled = true;
        }).catch(e => {
          console.log('Audio enable failed:', e);
        });

        // Test vibration
        if ('vibrate' in navigator) {
          navigator.vibrate(100);
        } else {
          console.log('Vibration not supported');
        }
        
      } catch (error) {
        console.error('Error enabling audio/vibration:', error);
      }
    }

    // Combined alert function
    function alertUser(type = 'normal') {
      
      if (audioEnabled) {
        beepSound.currentTime = 0;
        beepSound.play().catch(e => console.log('Audio play failed:', e));
      }
      
      if ('vibrate' in navigator) {
        navigator.vibrate(200);
      }
    }

    // Initialize the page with room-specific status text
    document.addEventListener('DOMContentLoaded', init);

  </script>
</body>

</html>
