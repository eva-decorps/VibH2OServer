<!DOCTYPE html>
<html>

<head>
  <title>Room Selection - Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d142b;
      color: #e0e6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    .container {
      text-align: center;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      color: #e0e6f0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
      margin-bottom: 40px;
      font-size: 1.2rem;
      color: #a0a6c0;
      opacity: 0.8;
      line-height: 1.4;
    }

    .room-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    .room-button {
      padding: 20px 30px;
      font-size: 1.4rem;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .room-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .room-button:active {
      transform: translateY(-1px);
      transition: all 0.1s ease;
    }

    /* Room-specific gradients */
    .room-1 { 
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%); 
    }
    
    .room-2 { 
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%); 
    }
    
    .room-3 { 
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); 
      color: #333; 
    }
    
    .room-4 { 
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); 
      color: #333; 
    }

    /* Hover effects */
    .room-1:hover { 
      background: linear-gradient(135deg, #ff8e53 0%, #ff6b6b 100%); 
    }
    
    .room-2:hover { 
      background: linear-gradient(135deg, #44a08d 0%, #4ecdc4 100%); 
    }
    
    .room-3:hover { 
      background: linear-gradient(135deg, #fed6e3 0%, #a8edea 100%); 
    }
    
    .room-4:hover { 
      background: linear-gradient(135deg, #fcb69f 0%, #ffecd2 100%); 
    }

    /* Add subtle animation on load */
    .room-button {
      opacity: 0;
      transform: translateY(20px);
      animation: slideInUp 0.6s ease forwards;
    }

    .room-button:nth-child(1) { animation-delay: 0.1s; }
    .room-button:nth-child(2) { animation-delay: 0.2s; }
    .room-button:nth-child(3) { animation-delay: 0.3s; }
    .room-button:nth-child(4) { animation-delay: 0.4s; }

    @keyframes slideInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
        width: 95%;
      }
      
      h1 {
        font-size: 2rem;
        margin-bottom: 15px;
      }
      
      .subtitle {
        font-size: 1.1rem;
        margin-bottom: 30px;
      }
      
      .room-button {
        padding: 18px 25px;
        font-size: 1.2rem;
        min-height: 60px;
      }
      
      .room-list {
        gap: 15px;
        margin-top: 20px;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 25px 15px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .room-button {
        padding: 15px 20px;
        font-size: 1.1rem;
        min-height: 55px;
      }
    }

    /* For very tall screens */
    @media (min-height: 800px) {
      .room-list {
        gap: 25px;
      }
      
      .room-button {
        min-height: 80px;
        padding: 25px 30px;
      }
    }

    /* Landscape orientation on mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      .container {
        padding: 20px 25px;
      }
      
      h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
      }
      
      .subtitle {
        font-size: 1rem;
        margin-bottom: 20px;
      }
      
      .room-list {
        gap: 12px;
        margin-top: 15px;
      }
      
      .room-button {
        min-height: 50px;
        padding: 12px 20px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🫀 Emotional Map</h1>
    <p class="subtitle">Select a room to view the BPM data</p>

    <div class="room-list">
      <button data-room="1" class="room-button room-1">Room 1</button>
      <button data-room="2" class="room-button room-2">Room 2</button>
      <button data-room="3" class="room-button room-3">Room 3</button>
      <button data-room="4" class="room-button room-4">Room 4</button>
    </div>
  </div>

  <script>
    // Get user id from URL
    const pathParts = window.location.pathname.split("/");
    const userId = pathParts[2];

    // Add click listeners to all room buttons
    document.querySelectorAll(".room-button").forEach(btn => {
      btn.addEventListener("click", (e) => {
        // Add visual feedback
        btn.style.transform = "scale(0.95)";
        setTimeout(() => {
          btn.style.transform = "";
        }, 150);

        // Navigate to room after brief delay for visual feedback
        setTimeout(() => {
          const roomId = btn.getAttribute("data-room");
          window.location.href = `/room/${roomId}/${userId}`;
        }, 200);
      });
    });

    // Add touch feedback for better mobile experience
    document.querySelectorAll(".room-button").forEach(btn => {
      btn.addEventListener("touchstart", () => {
        btn.style.transform = "translateY(-1px) scale(0.98)";
      });
      
      btn.addEventListener("touchend", () => {
        setTimeout(() => {
          btn.style.transform = "";
        }, 100);
      });
    });
  </script>
</body>
</html>
