<!DOCTYPE html>
<html>

<head>
  <title>Room Selection - Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/shared-styles.css">
  
  <style>

    .subtitle {
      margin-bottom: 40px;
      font-size: 1.2rem;
      color: #a0a6c0;
      opacity: 0.8;
      line-height: 1.4;
    }

    .room-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    .room-button {
      padding: 20px 30px;
      font-size: 1.4rem;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .room-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .room-button:active {
      transform: translateY(-1px);
      transition: all 0.1s ease;
    }

    /* Room-specific gradients */
    .room-1 { 
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%); 
    }
    
    .room-2 { 
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%); 
    }

    /* Hover effects */
    .room-1:hover { 
      background: linear-gradient(135deg, #ff8e53 0%, #ff6b6b 100%); 
    }
    
    .room-2:hover { 
      background: linear-gradient(135deg, #44a08d 0%, #4ecdc4 100%); 
    }

    /* Exit button section */
    .exit-section {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 2px solid rgba(160, 166, 192, 0.2);
      position: relative;
    }

    .exit-section::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(160, 166, 192, 0.4), transparent);
    }

    .exit-button {
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: 500;
      border: 2px solid rgba(160, 166, 192, 0.3);
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #a0a6c0;
      background: rgba(160, 166, 192, 0.05);
      backdrop-filter: blur(10px);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      width: fit-content;
      margin: 0 auto;
    }

    .exit-button:hover {
      transform: translateY(-2px);
      border-color: rgba(160, 166, 192, 0.5);
      background: rgba(160, 166, 192, 0.1);
      color: #c0c6dc;
      box-shadow: 0 4px 15px rgba(160, 166, 192, 0.1);
    }

    .exit-button:active {
      transform: translateY(0px);
      transition: all 0.1s ease;
    }

    .exit-button::before {
      content: '←';
      margin-right: 8px;
      font-size: 1.2em;
      transition: transform 0.3s ease;
    }

    .exit-button:hover::before {
      transform: translateX(-3px);
    }

    /* Add subtle animation on load */
    .room-button, .exit-section {
      opacity: 0;
      transform: translateY(20px);
      animation: slideInUp 0.6s ease forwards;
    }

    .room-button:nth-child(1) { animation-delay: 0.1s; }
    .room-button:nth-child(2) { animation-delay: 0.2s; }
    .exit-section { animation-delay: 0.3s; }

    @keyframes slideInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      .subtitle {
        font-size: 1.1rem;
        margin-bottom: 30px;
      }
      
      .room-button {
        padding: 18px 25px;
        font-size: 1.2rem;
        min-height: 60px;
      }
      
      .room-list {
        gap: 15px;
        margin-top: 20px;
      }

      .exit-section {
        margin-top: 40px;
        padding-top: 25px;
      }

      .exit-button {
        padding: 12px 30px;
        font-size: 1rem;
        min-height: 45px;
      }
    }

  </style>
</head>

<body>
  <div class="container">
    <h1>Corps connectés</h1>
    <p class="subtitle">Sélectionnez une installation pour enregistrer ou visualiser vos données.</p>

    <div class="room-list">
      <button data-room="1" class="room-button room-1">Karaoke</button>
      <button data-room="2" class="room-button room-2">Fresque</button>
    </div>

    <div class="exit-section">
      <button class="exit-button" onclick="exit()">Fin de l'expérience</button>
    </div>
  </div>

  <script>
    // Get user id from URL
    const userId = {{userId}};
    const showInfoRoom1 = {{showRoom1Info}};
    const showInfoRoom2 = {{showRoom2Info}};

    // Add click listeners to all room buttons
    document.querySelectorAll(".room-button").forEach(btn => {
      btn.addEventListener("click", (e) => {
        // Add visual feedback
        btn.style.transform = "scale(0.95)";
        setTimeout(() => {
          btn.style.transform = "";
        }, 150);

        // Navigate to room after brief delay for visual feedback
        setTimeout(() => {
          const roomId = btn.getAttribute("data-room");

          if (roomId == 1 && showInfoRoom1) {
            window.location.href = `/info-panel/karaoke/${userId}`;
          } else if (roomId == 2 && showInfoRoom2) {
            window.location.href = `/info-panel/fresque/${userId}`;
          } else {
             window.location.href = `/room/${roomId}/${userId}`;
          }

        }, 200);
      });
    });
    
    // Exit
    function exit() {
      window.location.href = `/info-panel/exit/${userId}`;
    }

    // Add touch feedback for better mobile experience
    document.querySelectorAll(".room-button").forEach(btn => {
      btn.addEventListener("touchstart", () => {
        btn.style.transform = "translateY(-1px) scale(0.98)";
      });
      
      btn.addEventListener("touchend", () => {
        setTimeout(() => {
          btn.style.transform = "";
        }, 100);
      });
    });
  </script>
</body>
</html>
