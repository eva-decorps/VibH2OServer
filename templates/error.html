<!DOCTYPE html>
<html>

<head>
  <title>Error - Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/shared-styles.css">
  
  <style>

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-weight: bold;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3e7552;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .back-link:hover {
      background: #2d5a3e;
    }

  </style>
</head>

<body>
  <div class="error-container">
    <h1>Corps connectés</h1>
    
    <div class="error-message">
      L'identifiant {{userId}} n'existe pas.
    </div>
    
    <div class="info">
      <strong>Saisissez le numéro inscrit sur votre carte pour accéder à vos données ! </strong> (entre 1 et {{numSeats}})
    </div>
    
    <a href="/" class="back-link">← Retour à l'authentification</a>
  </div>
</body>
</html>
