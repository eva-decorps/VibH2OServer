<!DOCTYPE html>
<html>

<head>
  <title>Error - Emotional Map</title>
  
  <style>
    html, body {
      margin: 0;
      padding: 20px;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0d142b;
      color: #e0e6f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .error-container {
      background: #1a2040;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #e0e6f0;
    }

    h2 {
      color: #e0e6f0;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-weight: bold;
    }

    .info {
      margin: 20px 0;
      background: #e8f4fd;
      border-radius: 8px;
      padding: 15px;
      color: #0c5460;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3e7552;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .back-link:hover {
      background: #2d5a3e;
    }
  </style>
</head>

<body>
  <div class="error-container">
    <h1>💔 Emotional Map</h1>
    
    <h2>❌ User not found</h2>
    
    <div class="error-message">
      The id "{{userId}}" does not exist.
    </div>
    
    <div class="info">
      <strong>Valid ids:</strong> Between 1 and {{numSeats}}
    </div>
    
    <a href="/" class="back-link">← Back to login</a>
  </div>
</body>
</html>
