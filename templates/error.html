<!DOCTYPE html>
<html>

<head>
  <title>Error - Emotional Map</title>
  <link rel="stylesheet" href="/shared-styles.css">
  
  <style>

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-weight: bold;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3e7552;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .back-link:hover {
      background: #2d5a3e;
    }

  </style>
</head>

<body>
  <div class="error-container">
    <h1>💔 Emotional Map</h1>
    
    <h2>❌ User not found</h2>
    
    <div class="error-message">
      The id "{{userId}}" does not exist.
    </div>
    
    <div class="info">
      <strong>Valid ids:</strong> Between 1 and {{numSeats}}
    </div>
    
    <a href="/" class="back-link">← Back to login</a>
  </div>
</body>
</html>
