<!DOCTYPE html>
<html>

<head>
  <title>Emotional Map - Authentication</title>
  <link rel="stylesheet" href="/shared-styles.css">
</head>

<body>
  <div class="auth-container">
    <h1>🫀 Emotional Map</h1>
    
    <div class="info">
      <strong>Configuration:</strong> {{numSeats}} Valid ids from 1 to {{numSeats}}
    </div>

    <input type="text" id="userIdInput" placeholder="Id (1 to {{numSeats}})" />
    <button class="btn-primary" onclick="authenticateUser()">Login</button>
    <div id="authStatus"></div>
  </div>

  <script>
    function authenticateUser() {
      // Go to authentication
      let userId = document.getElementById('userIdInput').value.trim();
      window.location.href = `/auth/${userId}`;
    }

    // Allow Enter key to submit
    document.getElementById('userIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        authenticateUser();
      }
    });
  </script>
</body>
</html>
