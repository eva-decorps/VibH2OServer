<!DOCTYPE html>
<html>

<head>
  <title>Emotional Map - Authentication</title>
  
  <style>
    html, body {
      margin: 0;
      padding: 20px;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0d142b;
      color: #e0e6f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-container {
      background: #1a2040;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #e0e6f0;
    }

    .info {
      margin-bottom: 20px;
      background: #e8f4fd;
      border-radius: 8px;
      padding: 15px;
      color: #0c5460;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #333;
      border-radius: 6px;
      background: #2a3050;
      color: #e0e6f0;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #3e7552;
      box-shadow: 0 0 5px rgba(62, 117, 82, 0.3);
    }

    button {
      width: 100%;
      padding: 12px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .btn-primary { 
      background: #3e7552; 
      color: white; 
    }

    .btn-primary:hover {
      background: #2d5a3e;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .success { 
      background: #d4edda; 
      color: #155724; 
    }

    .error { 
      background: #f8d7da; 
      color: #721c24; 
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <h1>🫀 Emotional Map</h1>
    
    <div class="info">
      <strong>Configuration:</strong> {{numSeats}} Valid ids from 1 to {{numSeats}}
    </div>

    <input type="text" id="userIdInput" placeholder="Id (1 to {{numSeats}})" />
    <button class="btn-primary" onclick="authenticateUser()">Login</button>
    <div id="authStatus"></div>
  </div>

  <script>
    function authenticateUser() {
      // Go to authentication
      let userId = document.getElementById('userIdInput').value.trim();
      window.location.href = `/auth/${userId}`;
    }

    // Allow Enter key to submit
    document.getElementById('userIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        authenticateUser();
      }
    });
  </script>
</body>
</html>
