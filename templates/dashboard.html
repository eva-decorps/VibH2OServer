<!DOCTYPE html>
<html>

<head>
  <title>Emotional Map - Dashboard</title>  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/lib/chart.min.js"></script>
  <script src="/lib/chartjs-plugin-annotation.min.js"></script>
  <link rel="stylesheet" href="/shared-styles.css">

  <style>

    /* Header Section */
    .header-section {
      text-align: center;
      flex: 1;
    }

    .room-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
      color: #e0e6f0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .room-subtitle {
      font-size: 1.2rem;
      color: #a0a6c0;
      margin: 10px 0 0 0;
      opacity: 0.9;
    }

    /* Stats Section */
    .stats-section {
      margin-bottom: 0px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
      margin-top: 10px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #e0e6f0;
      margin: 0;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #a0a6c0;
      margin: 5px 0 0 0;
      opacity: 0.9;
    }

    .stat-unit {
      font-size: 1rem;
      font-weight: bold;
      color: #e0e6f0;
      margin: 0;
      line-height: 1;
    }

    /* Chart Section */
    .chart-section {
      flex: 1;
      min-height: 250px;
      margin-bottom: 10px;
    }

    .chart-container {
      height: 250px;
      position: relative;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .chart-container:hover {
      opacity: 0.9;
    }

    /* Back Button */
    .back-button {
      width: 100%;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
      margin-bottom: 0px;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, #44a08d 0%, #4ecdc4 100%);
    }

    .back-button:active {
      transform: translateY(0);
    }

    /* Fullscreen Graph Styles */
    .fullscreen-overlay {
      display: none;
      position: fixed;
      border-radius: 20px;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1d2e;
      z-index: 1000;
      flex-direction: column;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .fullscreen-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .fullscreen-close::before,
    .fullscreen-close::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 2px;
      background: #e0e6f0;
    }

    .fullscreen-close::before {
      transform: rotate(45deg);
    }

    .fullscreen-close::after {
      transform: rotate(-45deg);
    }

    .fullscreen-chart-container {
      width: 100%;
      height: 100%;
      padding: 80px 30px 25px 25px;
      transform: rotate(90deg);
      transform-origin: center center;
    }

    /* Adjust container for rotated content */
    @media screen and (orientation: portrait) {
      .fullscreen-chart-container {
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

  </style>
</head>

<body>
  <div class="container">

    <!-- Header Section -->
    <div class="header-section">
      <h1>Corps connectés</h1>
      <p class="room-subtitle">Karaoké / Cinéma / ?</p>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Durée</div>
          <div class="stat-value" id="durationValue">00:00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Calories</div>
          <div class="stat-value" id="caloriesValue">0<span class="stat-unit"> kcal</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Fréquence moyenne</div>
          <div class="stat-value" id="avgHrValue">0<span class="stat-unit"> bpm</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Fréquence maximun</div>
          <div class="stat-value" id="maxHrValue">0<span class="stat-unit"> bpm</span></div>
        </div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="chart-section">
      <div class="chart-container" onclick="openFullscreen()">
        <canvas id="bpmChart"></canvas>
      </div>
    </div>

    <!-- Fullscreen Graph Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
      <div class="fullscreen-close" onclick="closeFullscreen()"></div>
      <div class="fullscreen-chart-container">
        <canvas id="bpmChartFullscreen"></canvas>
      </div>
    </div>

    <!-- Back Button -->
    <button class="back-button" onclick="backToRoomSelection()">
      Retour à la sélection
    </button>
  </div>

  <script>
    let chart = null;
    let fullscreenChart = null;
    let currentUser = '{{autoAuth}}' === 'true' ? '{{userId}}' : null;
    let roomId = '{{roomId}}';
    let currentData = null; // Store current chart data

    // Automatic authentification when authentication via link
    window.onload = function() {
      if (currentUser) {
        loadBpmData(currentUser);
      } else {
        // Redirect to authentication if no user
        window.location.href = '/';
      }
    };

    // Update room title
    const roomTitle = document.getElementsByClassName("room-subtitle")[0];
    if (roomId == 0) {
      roomTitle.innerHTML = "Cinéma";
    } else if (roomId == 1) {
      roomTitle.innerHTML = "Karaoké";
    } else if (roomId == 2) {
      roomTitle.innerHTML = "Fresque des émotions";
    }

    function backToRoomSelection() {
      window.location.href = `/room-selection/${currentUser}`;
    }

    function loadBpmData(userId) {
      fetch(`/api/bpm/${userId}/${roomId}`)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Store data for fullscreen use
            currentData = {
              bpmData: data.bpmData,
              time: data.time,
              profile: data.profile,
              mode: data.mode
            };
            updateChart();
            updateStats(data.bpmData[0], data.time);
          }
        })
        .catch(error => console.error('Erreur BPM:', error));
    }

    function updateStats(bpmData, time) {
      // Calculate duration
      if (time.length > 0) {
        const duration = (time[time.length - 1] - time[0]) / 1000;
        const hours = Math.floor(duration / 3600);
        const minutes = Math.floor((duration % 3600) / 60);
        const seconds = Math.floor(duration % 60);
        document.getElementById('durationValue').textContent = 
          `${minutes.toString().padStart(2, '0')}'${seconds.toString().padStart(2, '0')}''`;
      }

      // Calculate average HR
      const validBpm = bpmData.filter(val => val !== null && val > 0);
      if (validBpm.length > 0) {
        const avgHr = Math.round(validBpm.reduce((sum, val) => sum + val, 0) / validBpm.length);
        document.getElementById('avgHrValue').innerHTML = `${avgHr}<span class="stat-unit"> bpm</span>`;
      }

      // Calculate max HR
      if (validBpm.length > 0) {
        const maxHr = Math.max(...validBpm);
        document.getElementById('maxHrValue').innerHTML = `${maxHr}<span class="stat-unit"> bpm</span>`;
      }

      // Estimate calories (simple formula: avg HR * duration in hours * weight factor)
      if (validBpm.length > 0 && time.length > 0) {
        const avgHr = validBpm.reduce((sum, val) => sum + val, 0) / validBpm.length;
        const durationHours = (time[time.length - 1] - time[0]) / (1000 * 3600);
        const estimatedCalories = Math.round(avgHr * durationHours * 3.5); // Rough estimation
        document.getElementById('caloriesValue').innerHTML = `${estimatedCalories}<span class="stat-unit"> kcal</span>`;
      }
    }

    // Var for chart
    var datasets;
    var labels;
    var yMaxBound;
    var yMinBound;

    // Define color palette for multiple profiles
    const colors = [
      '#36A2EB', '#FF6384', '#4BC0C0', '#FF9F40', 
      '#9966FF', '#FFCD56', '#C9CBCF', '#FF6B9D'
    ];

    function createDatasets() {
      
      // Convert timestamps in relative time with format hour:min
      const time = currentData.time;
      
      const startTime = time[0];
      
      labels = time.map(timestamp => {
        const elapsedSeconds = (timestamp - startTime)/1000;
        const minutes = Math.floor(elapsedSeconds / 60);
        const seconds = Math.floor(elapsedSeconds % 60);
      
        return minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
      });

      // Collect all BPM values from all datasets to define y bounds
      const allBpmValues = [];
      currentData.bpmData.forEach(bpmArray => {
        allBpmValues.push(...bpmArray.filter(val => val !== null));
      });
      
      const minBpm = Math.min(...allBpmValues);
      const maxBpm = Math.max(...allBpmValues);

      yMinBound = Math.floor( (minBpm - (maxBpm-minBpm)*0.2) / 10 ) * 10;  
      yMaxBound = Math.ceil( (maxBpm + (maxBpm-minBpm)*0.2) / 10 ) * 10; 

      // Create a dataset for each profile
      datasets = currentData.bpmData.map((bpmArray, index) => ({
        label: currentData.profile[index],
        data: bpmArray,
        borderColor: colors[index % colors.length],
        borderWidth: 2,
        radius: 0,
        tension: 0.2,
        pointHoverRadius: 5
      }));

    }

    function updateChart() {
      // Create datasets for chart
      createDatasets();

      // Make sure no chart is already here
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(document.getElementById('bpmChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: {
                  size: 12
                },
                padding: 15
              }
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'Bpm',
                color: '#737fa9',
                font: {
                  size: 14
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 12
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Temps (min:sec)',
                color: '#737fa9',
                font: {
                  size: 14
                }
              },
              ticks: {
                maxTicksLimit: 8,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 12
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }

    function openFullscreen() {
      if (!currentData) return;

      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.add('active');

      // Lock orientation to landscape on mobile devices
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(err => {
          console.log('Orientation lock not supported:', err);
        });
      }

      // Create fullscreen chart
      setTimeout(() => {
        createFullscreenChart();
      }, 100);
    }

    function closeFullscreen() {
      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.remove('active');

      // Unlock orientation
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }

      // Destroy fullscreen chart
      if (fullscreenChart) {
        fullscreenChart.destroy();
        fullscreenChart = null;
      }
    }

    function createFullscreenChart() {
      // Create datasets for chart
      createDatasets();

      // Destroy existing fullscreen chart if any
      if (fullscreenChart) {
        fullscreenChart.destroy();
      }
      
      fullscreenChart = new Chart(document.getElementById('bpmChartFullscreen').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#e0e6f0',
                font: {
                  size: 16
                },
                padding: 20
              }
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'Bpm',
                color: '#e0e6f0',
                font: {
                  size: 18
                }
              },
              ticks: {
                color: '#e0e6f0',
                font: {
                  size: 14
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Temps (min:sec)',
                color: '#e0e6f0',
                font: {
                  size: 18
                }
              },
              ticks: {
                maxTicksLimit: 12,
                maxRotation: 45,
                minRotation: 0,
                color: '#e0e6f0',
                font: {
                  size: 14
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }
  </script>

</body>
</html>
