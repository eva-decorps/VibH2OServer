<!DOCTYPE html>
<html>

<head>
  <title>Emotional Map - Dashboard</title>  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding-left: 20px;
      padding-right: 20px;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0d142b;
      color: #e0e6f0;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      padding: 20px;
    }

    .chart-container {
      flex-grow: 1;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 20px;
      min-height: 0;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0; 
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .btn-success { 
      background: #5b232f; 
      color: white; 
      transition: background-color 0.3s;
    }

    .btn-success:hover {
      background: #441a23;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-bar">
      <h1>🫀 Emotional Map</h1>
      <div>
        <button class="btn-success" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="bpmChart"></canvas>
    </div>
  </div>

  <script>
    let chart = null;
    let currentUser = '{{autoAuth}}' === 'true' ? '{{userId}}' : null;

    // Automatic authentification when authentication via link
    window.onload = function() {
      if (currentUser) {
        loadBpmData(currentUser);
      } else {
        // Redirect to authentication if no user
        window.location.href = '/';
      }
    };

    function logout() {
      // Reset values
      currentUser = null;
      if(chart) {
        chart.destroy();
        chart = null;
      }

      // Redirect toward authentication page
      window.location.href = '/';
    }

    function loadBpmData(userId) {
      fetch(`/api/bpm/${userId}`)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            updateChart(data.bpmData, data.time, data.profile, data.avg, data.avgTime, data.landmarks);
          }
        })
        .catch(error => console.error('Erreur BPM:', error));
    }

    function updateChart(bpmData, time, profileName, avgBpm, avgTime, landmarks) {
      // Convert timestamps in relative time with format hour:min
      const startTime = time[0];
      const labels = time.map(timestamp => {
        const elapsedSeconds = (timestamp - startTime)/1000;
        const hours = Math.floor(elapsedSeconds / 3600);
        const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      
        return hours + ':' + minutes.toString().padStart(2, '0');
      });
      
      // Define y bounds
      const allBpmValues = [...bpmData, ...avgBpm].filter(val => val !== null);
      const minBpm = Math.min(...allBpmValues);
      const maxBpm = Math.max(...allBpmValues);

      const yMinBound = Math.floor( (minBpm - (maxBpm-minBpm)*0.2) / 10 ) * 10;  
      const yMaxBound = Math.ceil( (maxBpm + (maxBpm-minBpm)*0.2) / 10 ) * 10; 

      // Define datasets
      const datasets = [
        {
          label: 'Seat ' + profileName,
          data: bpmData,
          borderColor: '#36A2EB',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5
        },
        {
          label: 'Audience average',
          data: avgBpm,
          borderColor: '#dd7768',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5
        }
      ];
          
      // Create annotations for landmarks
      const annotations = {};
      landmarks.forEach((landmark, index) => {
        // Find the closest time index for this landmark
        const landmarkTime = landmark.timestamp;
        const closestIndex = time.findIndex(t => t >= landmarkTime);
        
        if (closestIndex >= 0) {
          // Vertical line
          annotations[`landmark${index}`] = {
            type: 'line',
            xMin: closestIndex,
            xMax: closestIndex,
            borderColor: landmark.color || '#FF6384',
            borderWidth: 2,
            borderDash: [5, 5],
            label: {
              content: landmark.label || 'Event',
              enabled: true,
              position: 'top',
              yAdjust: -160, // Need to find a trick to make it relative to graph height
              backgroundColor: landmark.color || '#FF6384',
              color: '#fff',
              font: {
                size: 12
              },
              padding: 4,
              rotation: 0
            }
          };
        }
      });

      // Define animation
      const totalDuration = 5000;
      const delayBetweenPoints = totalDuration / bpmData.length;
      const previousY = (ctx) => ctx.index === 0 ? ctx.chart.scales.y.getPixelForValue(100) : ctx.chart.getDatasetMeta(ctx.datasetIndex).data[ctx.index - 1].getProps(['y'], true).y;
      const animation = {
        x: {
          type: 'number',
          easing: 'linear',
          duration: delayBetweenPoints,
          from: NaN,
          delay(ctx) {
            if (ctx.type !== 'data' || ctx.xStarted) {
              return 0;
            }
            ctx.xStarted = true;
            return ctx.index * delayBetweenPoints;
          }
        },
        y: {
          type: 'number',
          easing: 'linear',
          duration: delayBetweenPoints,
          from: previousY,
          delay(ctx) {
            if (ctx.type !== 'data' || ctx.yStarted) {
              return 0;
            }
            ctx.yStarted = true;
            return ctx.index * delayBetweenPoints;
          }
        }
      };

      // Make sure no chart is already here
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(document.getElementById('bpmChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          //animation, // Doesn't work with annotations...
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: {
                  size: 15
                },
                padding: 20
              }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'BPM',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Elapsed time (h:min)',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }
  </script>

</body>
</html>
