<!DOCTYPE html>
<html>

<head>
  
  <title>Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/lib/chart.min.js"></script>
  <script src="/lib/chartjs-plugin-annotation.min.js"></script>
  <link rel="stylesheet" href="/shared-styles.css">
  
  <style>

    /* Header Section */
    .header-section {
      text-align: center;
      flex: 1;
    }

    .subtitle {
      font-size: 1rem;
      color: #a0a6c0;
      margin: 10px 10px 0 0;
      opacity: 0.9;
    }

    /* Chart Section */
    .chart-section {
      flex: 1;
      min-height: 400px;
      margin-bottom: 10px;
    }

    .chart-container {
      height: 400px;
      position: relative;
      cursor: pointer;
      transition: opacity 0.2s ease;
    } 

    .chart-container:hover {
      opacity: 0.9;
    }

    /* Fullscreen Graph Styles */
    .fullscreen-overlay {
      display: none;
      position: fixed;
      border-radius: 20px;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1d2e;
      z-index: 1000;
      flex-direction: column;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .fullscreen-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .fullscreen-close::before,
    .fullscreen-close::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 2px;
      background: #e0e6f0;
    }

    .fullscreen-close::before {
      transform: rotate(45deg);
    }

    .fullscreen-close::after {
      transform: rotate(-45deg);
    }

    .fullscreen-chart-container {
      width: 100%;
      height: 100%;
      padding: 60px 80px 25px 55px;
      transform: rotate(90deg);
      transform-origin: center center;
    }

    /* Adjust container for rotated content */
    @media screen and (orientation: portrait) {
      .fullscreen-chart-container {
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

  </style>

</head>

 
<body>
  <div class="container">

    <!-- Header Section -->
    <div class="header-section">
      <h1>Corps connectés</h1>

      <p class="subtitle">Cliquez sur le graphique pour l'aggrandir</p>
    </div>

    <!-- Chart Section -->
    <div class="chart-section">
      <div class="chart-container" onclick="openFullscreen()">
        <canvas id="bpmChart"></canvas>
      </div>
    </div>

    <!-- Fullscreen Graph Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
      <div class="fullscreen-close" onclick="closeFullscreen()"></div>
      <div class="fullscreen-chart-container">
        <canvas id="bpmChartFullscreen"></canvas>
      </div>
    </div>

    <!-- Back Button -->
    <button class="exit-button" onclick="logout()">Retour</button>
    
  </div>

  <script>
    let chart = null;
    let fullscreenChart = null;
    let currentUser = '{{userId}}';
    let currentData = null; // Store current chart data

    // Automatic authentification when authentication via link
    window.onload = function() {
      if (currentUser) {
        loadBpmData(currentUser);
      } else {
        // Redirect to authentication if no user
        window.location.href = '/';
      }
    };

    function logout() {
      // Redirect toward authentication page
      window.location.href = '/';
    }

    function loadBpmData(userId) {
      fetch(`/api/bpm/${userId}`)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Store data for fullscreen use
            currentData = {
              bpmData: data.bpmData,
              time: data.time,
              profile: data.profile,
              avgBpm: data.avg,
              landmarks: data.landmarks
            };
            updateChart();
          }
        })
        .catch(error => console.error('Erreur BPM:', error));
    }

    // Var for chart
    var datasets;
    var labels;
    var yMaxBound;
    var yMinBound;
    var annotation;
    var animation;

    function createDatasets() {

      const time = currentData.time;
      const bpmData = currentData.bpmData;
      const avgBpm = currentData.avgBpm;
      const landmarks = currentData.landmarks;
      const profileName = currentData.profile;
      
      // Convert timestamps in relative time with format hour:min
      const startTime = time[0];
      labels = time.map(timestamp => {
        const elapsedSeconds = (timestamp - startTime)/1000;
        const hours = Math.floor(elapsedSeconds / 3600);
        const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      
        return hours + ':' + minutes.toString().padStart(2, '0');
      });
      
      // Define y bounds
      const allBpmValues = [...bpmData, ...avgBpm].filter(val => val !== null);
      const minBpm = Math.min(...allBpmValues);
      const maxBpm = Math.max(...allBpmValues);

      yMinBound = Math.floor( (minBpm - (maxBpm-minBpm)*0.2) / 10 ) * 10;  
      yMaxBound = Math.ceil( (maxBpm + (maxBpm-minBpm)*0.2) / 10 ) * 10; 

      // Define datasets
      datasets = [
        {
          label: 'Capteur ' + profileName,
          data: bpmData,
          borderColor: '#36A2EB',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5
        },
        {
          label: 'Moyenne du public',
          data: avgBpm,
          borderColor: '#dd7768',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5
        }
      ];
          
      // Create annotations for landmarks
      annotations = {};
      landmarks.forEach((landmark, index) => {
        // Find the closest time index for this landmark
        const landmarkTime = landmark.timestamp;
        const closestIndex = time.findIndex(t => t >= landmarkTime);
        
        if (closestIndex >= 0) {
          // Vertical line
          annotations[`landmark${index}`] = {
            type: 'line',
            xMin: closestIndex,
            xMax: closestIndex,
            borderColor: landmark.color || '#FF6384',
            borderWidth: 2,
            borderDash: [5, 5],
            label: {
              content: landmark.label || 'Event',
              enabled: true,
              position: 'top',
              yAdjust: -160, // Need to find a trick to make it relative to graph height
              backgroundColor: landmark.color || '#FF6384',
              color: '#fff',
              font: {
                size: 12
              },
              padding: 4,
              rotation: 0
            }
          };
        }
      });

      // Define animation
      const totalDuration = 5000;
      const delayBetweenPoints = totalDuration / currentData.bpmData.length;
      const previousY = (ctx) => ctx.index === 0 ? ctx.chart.scales.y.getPixelForValue(100) : ctx.chart.getDatasetMeta(ctx.datasetIndex).data[ctx.index - 1].getProps(['y'], true).y;
      animation = {
        x: {
          type: 'number',
          easing: 'linear',
          duration: delayBetweenPoints,
          from: NaN,
          delay(ctx) {
            if (ctx.type !== 'data' || ctx.xStarted) {
              return 0;
            }
            ctx.xStarted = true;
            return ctx.index * delayBetweenPoints;
          }
        },
        y: {
          type: 'number',
          easing: 'linear',
          duration: delayBetweenPoints,
          from: previousY,
          delay(ctx) {
            if (ctx.type !== 'data' || ctx.yStarted) {
              return 0;
            }
            ctx.yStarted = true;
            return ctx.index * delayBetweenPoints;
          }
        }
      };
    }

    function updateChart() {

      createDatasets();

      // Make sure no chart is already here
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(document.getElementById('bpmChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          //animation, // Doesn't work with annotations...
          responsive: true,
          maintainAspectRatio: false, 
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: {
                  size: 15
                },
                padding: 20
              }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'BPM',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Temps (h:min)',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }

    function openFullscreen() {
      if (!currentData) return;

      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.add('active');

      // Lock orientation to landscape on mobile devices
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(err => {
          console.log('Orientation lock not supported:', err);
        });
      }

      // Create fullscreen chart
      setTimeout(() => {
        createFullscreenChart();
      }, 100);
    }

    function closeFullscreen() {
      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.remove('active');

      // Unlock orientation
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }

      // Destroy fullscreen chart
      if (fullscreenChart) {
        fullscreenChart.destroy();
        fullscreenChart = null;
      }
    }

    function createFullscreenChart() {
      // Create datasets for chart
      createDatasets();

      // Destroy existing fullscreen chart if any
      if (fullscreenChart) {
        fullscreenChart.destroy();
      }
      
      fullscreenChart = new Chart(document.getElementById('bpmChartFullscreen').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          //animation, // Doesn't work with annotations...
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: {
                  size: 15
                },
                padding: 20
              }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'BPM',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Elapsed time (h:min)',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }

  </script>

</body>
</html>
