<!DOCTYPE html>
<html>

<head>
  
  <title>Emotional Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/lib/chart.min.js"></script>
  <script src="/lib/chartjs-plugin-annotation.min.js"></script>
  <link rel="stylesheet" href="/shared-styles.css">
  
  <style>

    /* Header Section */
    .header-section {
      text-align: center;
      flex: 1;
    }

    .subtitle {
      font-size: 1rem;
      color: #a0a6c0;
      margin: 10px 10px 0 0;
      opacity: 0.9;
    }

    /* Chart Section */
    .chart-section {
      flex: 1;
      min-height: 400px;
      margin-bottom: 10px;
    }

    .chart-container {
      height: 400px;
      position: relative;
      cursor: pointer;
      transition: opacity 0.2s ease;
    } 

    .chart-container:hover {
      opacity: 0.9;
    }

    /* Fullscreen Graph Styles */
    .fullscreen-overlay {
      display: none;
      position: fixed;
      border-radius: 20px;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1d2e;
      z-index: 1000;
      flex-direction: column;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .fullscreen-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .fullscreen-close::before,
    .fullscreen-close::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 2px;
      background: #e0e6f0;
    }

    .fullscreen-close::before {
      transform: rotate(45deg);
    }

    .fullscreen-close::after {
      transform: rotate(-45deg);
    }

    .fullscreen-chart-container {
      transition: transform 0.3s ease;
    }

    /* Portrait mode: rotate the container */
    @media screen and (orientation: portrait) {
      .fullscreen-chart-container {
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
        padding: 55px 80px 25px 55px;
      }
    }

    /* Landscape mode: full width and height, no rotation */
    @media screen and (orientation: landscape) {
      .fullscreen-chart-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform: none;
        padding: 80px 80px 40px 80px;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        height: 100%;
        transform: none;
        padding: 20px 30px;
        margin: 0;
      }
    }

  </style>

</head>

 
<body>
  <div class="container">

    <!-- Header Section -->
    <div class="header-section">
      <h1>Expérience VIBH2O</h1>

      <p class="subtitle">Cliquez sur le graphique pour l'aggrandir</p>
    </div>

    <!-- Chart Section -->
    <div class="chart-section">
      <div class="chart-container" onclick="openFullscreen()">
        <canvas id="bpmChart"></canvas>
      </div>
    </div>

    <!-- Fullscreen Graph Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
      <div class="fullscreen-close" onclick="closeFullscreen()"></div>
      <div class="fullscreen-chart-container">
        <canvas id="bpmChartFullscreen"></canvas>
      </div>
    </div>

    <!-- Back Button -->
    <button class="exit-button" onclick="logout()">Retour</button>
    
  </div>

  <script>
    let chart = null;
    let fullscreenChart = null;
    let currentUser = '{{userId}}';
    let currentData = null; // Store current chart data

    // Automatic authentification when authentication via link
    window.onload = function() {
      if (currentUser) {
        loadBpmData(currentUser);
      } else {
        // Redirect to authentication if no user
        window.location.href = '/';
      }
    };

    function logout() {
      // Redirect toward authentication page
      window.location.href = '/';
    }

    function loadBpmData(userId) {
      fetch(`/api/bpm/${userId}`)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Store data for fullscreen use
            currentData = {
              bpmData: data.bpmData,
              time: data.time,
              profile: data.profile,
              avgBpm: data.avg,
              stdBpm: data.std, 
              landmarks: data.landmarks,
              synchronieData: data.synchronieData,
              synchronieTime: data.synchronieTime
            };
            updateChart();
          }
        })
        .catch(error => console.error('Erreur BPM:', error));
    }

    // Var for chart
    var datasets;
    var labels;
    var yMaxBound;
    var yMinBound;
    var annotation;
    var animation;

    function createDatasets() {

      const time = currentData.time;
      const bpmData = currentData.bpmData;
      const avgBpm = currentData.avgBpm;
      const landmarks = currentData.landmarks;
      const profileName = currentData.profile;
      const synchronieData = currentData.synchronieData;
      const synchronieTime = currentData.synchronieTime;

      // Standart deviation
      const stdBpm = currentData.stdBpm;
      //console.log(stdBpm);

      // Compute upper and lower std deviation bands
      const avgUpper = avgBpm.map((v, i) => v !== null && stdBpm[i] != null ? v + stdBpm[i] : null);
      const avgLower = avgBpm.map((v, i) => v !== null && stdBpm[i] != null ? v - stdBpm[i] : null);
      
      // Convert timestamps in relative time with format hour:min
      const startTime = time[0];
      labels = time.map(timestamp => {
        const elapsedSeconds = (timestamp - startTime)/1000;
        const hours = Math.floor(elapsedSeconds / 3600);
        const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      
        return hours + ':' + minutes.toString().padStart(2, '0');
      });

      // Remap synchronieTime to time so it ends at the same timestamp
      const timeEnd = time[time.length - 1];
      const synchronieTimeEnd = synchronieTime[synchronieTime.length - 1];
      const timeShift = timeEnd - synchronieTimeEnd;

      const remappedSynchronieTime = synchronieTime.map(t => t + timeShift);
      
      // Map synchronieData to the time axis
      const mappedSynchronieData = time.map(timestamp => {
        const closestIndex = remappedSynchronieTime.findIndex((t, i) => {
          if (i === remappedSynchronieTime.length - 1) return true;
          return timestamp >= t && timestamp < remappedSynchronieTime[i + 1];
        });
        return closestIndex > 0 ? synchronieData[closestIndex] : null;
      });

      // Define y bounds
      const allBpmValues = [...bpmData, ...avgBpm].filter(val => val !== null);
      const minBpm = Math.min(...allBpmValues);
      const maxBpm = Math.max(...allBpmValues);

      yMinBound = Math.floor( (minBpm - (maxBpm-minBpm)*0.2) / 10 ) * 10;  
      yMaxBound = Math.ceil( (maxBpm + (maxBpm-minBpm)*0.2) / 10 ) * 10; 

      // Define datasets
      datasets = [
        // {
        //   label: 'Capteur ' + profileName,
        //   data: bpmData,
        //   borderColor: '#36A2EB',
        //   borderWidth: 2,
        //   radius: 0,
        //   tension: 0.2,
        //   pointHoverRadius: 5
        // },
        {
          label: '',
          data: avgUpper,
          borderColor: 'transparent',
          backgroundColor: 'rgba(221, 119, 104, 0.15)',
          fill: '+1',
          radius: 0,
          pointHoverRadius: 0,
          tension: 0.2,
          yAxisID: 'y'
        },
        {
          label: 'Écart-type public',
          data: avgLower,
          borderColor: 'transparent',
          backgroundColor: 'rgba(221, 119, 104, 0.15)',
          fill: false,
          radius: 0,
          pointHoverRadius: 0,
          tension: 0.2,
          yAxisID: 'y'
        },
        {
          label: 'Moyenne public',
          data: avgBpm,
          borderColor: '#dd7768',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5,
          yAxisID: 'y'
        },
        {
          label: 'Synchronie',
          data: mappedSynchronieData,
          borderColor: '#4BC0C0',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5,
          yAxisID: 'y-right'
        }
      ];
          
      // Create annotations for landmarks
      annotations = {};
      landmarks.forEach((landmark, index) => {
        // Find the closest time index for this landmark
        const landmarkTime = landmark.timestamp;
        const closestIndex = time.findIndex(t => t >= landmarkTime);
        
        if (closestIndex >= 0) {
          // Vertical line
          annotations[`landmark${index}`] = {
            type: 'line',
            xMin: closestIndex,
            xMax: closestIndex,
            borderColor: landmark.color || '#FF6384',
            borderWidth: 2,
            borderDash: [5, 5],
            label: {
              content: landmark.label || 'Event',
              enabled: true,
              position: 'top',
              yAdjust: -130 + index %2 * 25, // Need to find a trick to make it relative to graph height
              backgroundColor: landmark.color || '#FF6384',
              color: '#fff',
              font: {
                size: 12
              },
              padding: 4,
              rotation: 0
            }
          };
        }
      });

      // Define animation
      const totalDuration = 5000;
      const delayBetweenPoints = totalDuration / currentData.bpmData.length;
      const previousY = (ctx) => ctx.index === 0 ? ctx.chart.scales.y.getPixelForValue(100) : ctx.chart.getDatasetMeta(ctx.datasetIndex).data[ctx.index - 1].getProps(['y'], true).y;
      animation = {
        x: {
          type: 'number',
          easing: 'linear',
          duration: delayBetweenPoints,
          from: NaN,
          delay(ctx) {
            if (ctx.type !== 'data' || ctx.xStarted) {
              return 0;
            }
            ctx.xStarted = true;
            return ctx.index * delayBetweenPoints;
          }
        },
        y: {
          type: 'number',
          easing: 'linear',
          duration: delayBetweenPoints,
          from: previousY,
          delay(ctx) {
            if (ctx.type !== 'data' || ctx.yStarted) {
              return 0;
            }
            ctx.yStarted = true;
            return ctx.index * delayBetweenPoints;
          }
        }
      };
    }

    function updateChart() {

      createDatasets();

      // Make sure no chart is already here
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(document.getElementById('bpmChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          //animation, // Doesn't work with annotations...
          responsive: true,
          maintainAspectRatio: false, 
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: { size: 15 },
                padding: 20
              }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              position: 'left',
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'BPM',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Temps (h:min)',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
      
      Chart.register(Chart.registry.plugins.get('filler'));
    }

    function openFullscreen() {
      if (!currentData) return;

      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.add('active');

      // Try to lock orientation to landscape on mobile devices
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(err => {
          console.log('Orientation lock not supported:', err);
        });
      }

      // Create fullscreen chart
      setTimeout(() => {
        createFullscreenChart();
      }, 100);

      // Listen for orientation changes while in fullscreen
      window.addEventListener('orientationchange', handleOrientationChange);
      window.addEventListener('resize', handleOrientationChange);
    }

    function closeFullscreen() {
      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.remove('active');

      // Unlock orientation
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }

      // Remove orientation change listeners
      window.removeEventListener('orientationchange', handleOrientationChange);
      window.removeEventListener('resize', handleOrientationChange);

      // Destroy fullscreen chart
      if (fullscreenChart) {
        fullscreenChart.destroy();
        fullscreenChart = null;
      }
    }

    function handleOrientationChange() {
      // Recreate the chart when orientation changes
      if (fullscreenChart && currentData) {
        setTimeout(() => {
          createFullscreenChart();
        }, 100);
      }
    }

    function createFullscreenChart() {
      // Create datasets for chart
      createDatasets();

      // Destroy existing fullscreen chart if any
      if (fullscreenChart) {
        fullscreenChart.destroy();
      }
      
      fullscreenChart = new Chart(document.getElementById('bpmChartFullscreen').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          //animation, // Doesn't work with annotations...
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: {
                  size: 15
                },
                padding: 20
              }
            },
            annotation: {
              annotations: annotations
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'BPM',
                color: '#737fa9',
                font: {
                  size: 17
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Temps (h:min)',
                color: '#737fa9',
                font: {
                  size: 17
              }
              },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 15
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }

  </script>

</body>
</html>
