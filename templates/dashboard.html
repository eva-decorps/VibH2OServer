<!DOCTYPE html>
<html>

<head>
  <title>Emotional Map - Dashboard</title>  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d142b;
      color: #e0e6f0;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Header Section */
    .header-section {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .room-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
      color: #e0e6f0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .room-subtitle {
      font-size: 1.2rem;
      color: #a0a6c0;
      margin: 10px 0 0 0;
      opacity: 0.9;
    }

    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: #5b232f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.3s;
    }

    .logout-btn:hover {
      background: #441a23;
    }

    /* Stats Section */
    .stats-section {
      margin-bottom: 30px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
      display: block;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #e0e6f0;
      margin: 0;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #a0a6c0;
      margin: 5px 0 0 0;
      opacity: 0.9;
    }

    .stat-unit {
      font-size: 1.2rem;
      color: #a0a6c0;
      font-weight: normal;
    }

    /* Chart Section */
    .chart-section {
      flex: 1;
      min-height: 300px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .chart-container {
      height: 300px;
      position: relative;
    }

    /* Back Button */
    .back-button {
      width: 100%;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
      margin-bottom: 20px;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, #44a08d 0%, #4ecdc4 100%);
    }

    .back-button:active {
      transform: translateY(0);
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .container {
        padding: 15px;
        min-width: 280px;
      }
      
      .room-title {
        font-size: 2rem;
      }
      
      .stat-value {
        font-size: 1.8rem;
      }
      
      .logout-btn {
        top: 15px;
        right: 15px;
        padding: 8px 15px;
        font-size: 0.8rem;
      }
      
      .chart-container {
        height: 250px;
      }
      
      .session-duration {
        font-size: 1.5rem;
        margin-top: -30px;
      }
    }

    @media (max-height: 700px) {
      .chart-container {
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <button class="logout-btn" onclick="logout()">Logout</button>

    <!-- Header Section -->
    <div class="header-section">
      <h1 class="room-title">🫀 Emotional Map</h1>
      <p class="room-subtitle">Room 1</p>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">⏱️</span>
          <div class="stat-value" id="durationValue">0:00:00</div>
          <div class="stat-label">Duration</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💖</span>
          <div class="stat-value" id="avgHrValue">0<span class="stat-unit">bpm</span></div>
          <div class="stat-label">HR avg</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">🔥</span>
          <div class="stat-value" id="caloriesValue">0<span class="stat-unit">kcal</span></div>
          <div class="stat-label">Calories</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💖</span>
          <div class="stat-value" id="maxHrValue">0<span class="stat-unit">bpm</span></div>
          <div class="stat-label">HR max</div>
        </div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="chart-section">
      <div class="chart-container">
        <canvas id="bpmChart"></canvas>
      </div>
    </div>

    <!-- Back Button -->
    <button class="back-button" onclick="backToRoomSelection()">
      Back to Room Selection
    </button>
  </div>

  <script>
    let chart = null;
    let currentUser = '{{autoAuth}}' === 'true' ? '{{userId}}' : null;
    let roomId = '{{roomId}}';

    // Automatic authentification when authentication via link
    window.onload = function() {
      if (currentUser) {
        loadBpmData(currentUser);
      } else {
        // Redirect to authentication if no user
        window.location.href = '/';
      }
    };

    function logout() {
      // Reset values
      currentUser = null;
      if(chart) {
        chart.destroy();
        chart = null;
      }

      // Redirect toward authentication page
      window.location.href = '/';
    }

    function backToRoomSelection() {
      window.location.href = `/room-selection/${currentUser}`;
    }

    function loadBpmData(userId) {
      fetch(`/api/bpm/${userId}/${roomId}`)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            updateChart(data.bpmData, data.time, data.profile);
            updateStats(data.bpmData, data.time);
          }
        })
        .catch(error => console.error('Erreur BPM:', error));
    }

    function updateStats(bpmData, time) {
      // Calculate duration
      if (time.length > 0) {
        const duration = (time[time.length - 1] - time[0]) / 1000;
        const hours = Math.floor(duration / 3600);
        const minutes = Math.floor((duration % 3600) / 60);
        const seconds = Math.floor(duration % 60);
        document.getElementById('durationValue').textContent = 
          `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      // Calculate average HR
      const validBpm = bpmData.filter(val => val !== null && val > 0);
      if (validBpm.length > 0) {
        const avgHr = Math.round(validBpm.reduce((sum, val) => sum + val, 0) / validBpm.length);
        document.getElementById('avgHrValue').innerHTML = `${avgHr}<span class="stat-unit">bpm</span>`;
      }

      // Calculate max HR
      if (validBpm.length > 0) {
        const maxHr = Math.max(...validBpm);
        document.getElementById('maxHrValue').innerHTML = `${maxHr}<span class="stat-unit">bpm</span>`;
      }

      // Estimate calories (simple formula: avg HR * duration in hours * weight factor)
      if (validBpm.length > 0 && time.length > 0) {
        const avgHr = validBpm.reduce((sum, val) => sum + val, 0) / validBpm.length;
        const durationHours = (time[time.length - 1] - time[0]) / (1000 * 3600);
        const estimatedCalories = Math.round(avgHr * durationHours * 3.5); // Rough estimation
        document.getElementById('caloriesValue').innerHTML = `${estimatedCalories}<span class="stat-unit">kcal</span>`;
      }
    }

    function updateChart(bpmData, time, profileName) {
      // Convert timestamps in relative time with format hour:min
      const startTime = time[0];
      const labels = time.map(timestamp => {
        const elapsedSeconds = (timestamp - startTime)/1000;
        const hours = Math.floor(elapsedSeconds / 3600);
        const minutes = Math.floor((elapsedSeconds % 3600) / 60);
        const seconds = Math.floor(elapsedSeconds % 3600);
      
        return hours + ':' + minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
      });
      
      // Define y bounds
      const allBpmValues = [...bpmData].filter(val => val !== null);
      const minBpm = Math.min(...allBpmValues);
      const maxBpm = Math.max(...allBpmValues);

      const yMinBound = Math.floor( (minBpm - (maxBpm-minBpm)*0.2) / 10 ) * 10;  
      const yMaxBound = Math.ceil( (maxBpm + (maxBpm-minBpm)*0.2) / 10 ) * 10; 

      console.log(bpmData);

      // Define datasets
      const datasets = [
        {
          label: 'Seat ' + profileName,
          data: bpmData,
          borderColor: '#36A2EB',
          borderWidth: 2,
          radius: 0,
          tension: 0.2,
          pointHoverRadius: 5
        }
      ];

      // Make sure no chart is already here
      if (chart) {
        chart.destroy();
      }
      
      chart = new Chart(document.getElementById('bpmChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#737fa9',
                font: {
                  size: 12
                },
                padding: 15
              }
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: yMinBound,
              max: yMaxBound,
              title: {
                display: true,
                text: 'BPM',
                color: '#737fa9',
                font: {
                  size: 14
                }
              },
              ticks: {
                color: '#737fa9',
                font: {
                  size: 12
                }
              },
              grid: {
                color: '#232734'
              }
            },
            x: {
              title: {
                display: true,
                text: 'Time (h:min)',
                color: '#737fa9',
                font: {
                  size: 14
                }
              },
              ticks: {
                maxTicksLimit: 8,
                maxRotation: 45,
                minRotation: 0,
                color: '#737fa9',
                font: {
                  size: 12
                }
              },
              grid: {
                color: '#232734'
              }
            }
          }
        }
      });
    }
  </script>

</body>
</html>
